<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>메랜 유틸리티</title>
<style>
:root{--bg:#eef2f7;--panel:#fff;--text:#172033;--muted:#6b7280;--line:#dfe5ed;--accent:#2563eb;--accentSoft:#eaf2ff;--shadow:0 14px 36px rgba(20,32,56,.10)}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;font-family:Pretendard,"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;background:var(--bg);color:var(--text)}
body{overflow:hidden}
.app{height:100vh;display:grid;grid-template-rows:auto auto 1fr}
.header{background:#fff;border-bottom:1px solid var(--line);padding:16px 22px;display:flex;align-items:center;justify-content:space-between;gap:18px;box-shadow:0 2px 12px rgba(15,23,42,.04);z-index:3}
.brand h1{margin:0;font-size:22px;letter-spacing:-.5px}
.brand p{margin:5px 0 0;font-size:12px;color:var(--muted)}
.category-label{font-size:12px;font-weight:800;color:#000;white-space:nowrap}
.nav-wrap{background:#f8fafc;border-bottom:1px solid var(--line);padding:10px 18px;z-index:2}
.nav{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.nav-btn{min-width:0;border:1px solid var(--line);background:#fff;border-radius:13px;padding:11px 14px;text-align:left;cursor:pointer;transition:.16s;display:flex;align-items:center;gap:11px}
.nav-btn:hover{transform:translateY(-1px);border-color:#b9c6da;box-shadow:0 4px 14px rgba(15,23,42,.06)}
.nav-btn.active{border-color:#8eb3ff;background:var(--accentSoft);box-shadow:inset 0 0 0 1px rgba(37,99,235,.08)}
.icon{width:34px;height:34px;border-radius:10px;background:#f2f5f9;display:grid;place-items:center;font-size:18px;flex:0 0 auto}
.nav-btn.active .icon{background:#fff}
.nav-text{min-width:0}
.nav-title{font-size:14px;font-weight:900;color:#000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-desc{font-size:11px;color:#000;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage{position:relative;min-height:0;background:#f4f6f9}
.frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;display:none}
.frame.active{display:block}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:#64748b;font-weight:800;background:#f8fafc}
@media(max-width:760px){
  .header{padding:12px 14px} .brand h1{font-size:19px} .brand p,.category-label{display:none}
  .nav-wrap{padding:8px} .nav{gap:6px} .nav-btn{padding:9px 8px;justify-content:center} .nav-desc{display:none} .icon{width:30px;height:30px;font-size:16px} .nav-title{font-size:12px}
}
@media(max-width:480px){.nav-btn{flex-direction:column;gap:4px;text-align:center}}
</style>
</head>

<div class="app">
  <header class="header">
    <div class="brand"><h1>메랜 유틸리티</h1><p>by. 음흉꽁</p></div>
    <div class="category-label" id="currentLabel">구인 양식</div>
  </header>
  <div class="nav-wrap">

  </div>

  </main>
</div>

const labels = {recruit:'구인 양식', split:'분배금 계산기', level:'레벨업 계산기'};
const loaded = new Set();
function decodeBase64Utf8(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}
function ensureLoaded(key) {
  if (loaded.has(key)) return;
  const frame = document.getElementById('frame-'+key);
  frame.srcdoc = decodeBase64Utf8(docs[key]);
  loaded.add(key);
  frame.addEventListener('load',()=>{document.getElementById('loading').style.display='none';},{once:true});
}
function selectTool(key) {
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.tool===key));
  document.querySelectorAll('.frame').forEach(f=>f.classList.remove('active'));
  const frame=document.getElementById('frame-'+key);
  frame.classList.add('active');
  document.getElementById('currentLabel').textContent=labels[key];
  ensureLoaded(key);
  try{localStorage.setItem('mapleUtilLastTool',key)}catch(e){}
}
document.querySelectorAll('.nav-btn').forEach(btn=>btn.addEventListener('click',()=>selectTool(btn.dataset.tool)));
let initial='recruit';
try{const saved=localStorage.getItem('mapleUtilLastTool'); if(labels[saved]) initial=saved;}catch(e){}
selectTool(initial);
</script>
